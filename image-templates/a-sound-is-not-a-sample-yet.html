<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #07172f;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, #1a4ea0 0%, #0e3478 35%, #0a2755 65%, #07172f 100%);
    overflow: hidden;
  }

  /* Soft vignette over the gradient */
  .canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 95% 80% at 50% 50%, transparent 55%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }

  .diagram {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <div class="canvas">
    <svg class="diagram" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Restrained glow for the transient -->
        <filter id="curveGlow" x="-30%" y="-20%" width="160%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Soft glow for the boundary brackets -->
        <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Selected waveform: cyan body, lifting slightly toward the centreline -->
        <linearGradient id="waveGrad" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="790">
          <stop offset="0%"   stop-color="#6fd2ff"/>
          <stop offset="50%"  stop-color="#a9e2ff"/>
          <stop offset="100%" stop-color="#6fd2ff"/>
        </linearGradient>
        <!-- Selection zone tint -->
        <linearGradient id="selGrad" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="850">
          <stop offset="0%"   stop-color="#5ecbff" stop-opacity="0.02"/>
          <stop offset="50%"  stop-color="#5ecbff" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#5ecbff" stop-opacity="0.02"/>
        </linearGradient>
        <!-- Timeline gradient (fade at both ends), horizontal -->
        <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="76" y1="0" x2="1004" y2="0">
          <stop offset="0%"   stop-color="#5ecbff" stop-opacity="0"/>
          <stop offset="14%"  stop-color="#5ecbff" stop-opacity="0.38"/>
          <stop offset="86%"  stop-color="#5ecbff" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="#5ecbff" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- The chosen region: what the recording is being reduced to -->
      <rect x="344" y="230" width="256" height="620" fill="url(#selGrad)"/>

      <!-- Timeline: the whole recording runs edge to edge -->
      <line x1="76" y1="540" x2="1004" y2="540" stroke="url(#lineGrad)" stroke-width="2"/>

      </g>

      <!-- The transient that made you press record -->
      <g fill="url(#waveGrad)" filter="url(#curveGlow)">
        <rect x="384" y="290.0" width="7" height="500.0" rx="3.5"/>
        <rect x="396" y="336.0" width="7" height="408.0" rx="3.5"/>
        <rect x="408" y="353.4" width="7" height="373.2" rx="3.5"/>
      </g>

      <!-- A second contact further along the same take: one recording, several assets -->
      <g stroke="#5ecbff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
         stroke-dasharray="9 13" fill="none" opacity="0.42">
        <path d="M 658 372 L 626 372 L 626 708 L 658 708"/>
        <path d="M 766 372 L 798 372 L 798 708 L 766 708"/>
      </g>

      <!-- Selection boundaries: the decision itself -->
      <g stroke="#ffd6c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
         fill="none" filter="url(#dotGlow)" opacity="0.92">
        <path d="M 384 240 L 344 240 L 344 840 L 384 840"/>
        <path d="M 560 240 L 600 240 L 600 840 L 560 840"/>
      </g>

      <!-- Boundary handles on the centreline -->
      <g fill="#ffd6c2" filter="url(#dotGlow)">
        <circle cx="344" cy="540" r="8"/>
        <circle cx="600" cy="540" r="8"/>
      </g>
    </svg>

</body>
</html>
