<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #07172f;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, #1a4ea0 0%, #0e3478 35%, #0a2755 65%, #07172f 100%);
    overflow: hidden;
  }

  /* Soft vignette over the gradient */
  .canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 95% 80% at 50% 50%, transparent 55%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }

  .diagram {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>

        <!-- Restrained glow for the cup outline and each reshaped version -->
        <filter id="curveGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Soft glow for the tap and the shared onset -->
        <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="blur"/>

            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <linearGradient id="laneA" gradientUnits="userSpaceOnUse" x1="0" y1="222" x2="0" y2="414">
          <stop offset="0%"   stop-color="#6fd2ff"/>
          <stop offset="50%"  stop-color="#a9e2ff"/>
          <stop offset="100%" stop-color="#6fd2ff"/>
        </linearGradient>
        <linearGradient id="laneB" gradientUnits="userSpaceOnUse" x1="0" y1="444" x2="0" y2="636">

          <stop offset="50%"  stop-color="#a9e2ff"/>
          <stop offset="100%" stop-color="#6fd2ff"/>
        </linearGradient>
        <linearGradient id="cupGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#6fd2ff"/>
          <stop offset="100%" stop-color="#a9e2ff"/>
        </linearGradient>
        <!-- Timeline gradient (fade at both ends), horizontal -->
        <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="1000" y2="0">

          <stop offset="10%"  stop-color="#5ecbff" stop-opacity="0.34"/>
          <stop offset="86%"  stop-color="#5ecbff" stop-opacity="0.34"/>
          <stop offset="100%" stop-color="#5ecbff" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="ringFade" gradientUnits="userSpaceOnUse" cx="346" cy="548" r="140">
          <stop offset="0%"   stop-color="#fff" stop-opacity="1"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="ringMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080">
          <rect x="0" y="0" width="1080" height="1080" fill="url(#ringFade)"/>
        </mask>
