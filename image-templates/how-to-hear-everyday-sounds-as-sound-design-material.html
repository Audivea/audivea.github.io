<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #07172f;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, #1a4ea0 0%, #0e3478 35%, #0a2755 65%, #07172f 100%);
    overflow: hidden;
  }

  /* Soft vignette over the gradient */
  .canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 95% 80% at 50% 50%, transparent 55%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }

  .diagram {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>

      <defs>
        <!-- Restrained glow for whatever each reading brings forward -->
        <filter id="curveGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Soft glow for the shared moment -->
        <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <linearGradient id="waveA" gradientUnits="userSpaceOnUse" x1="0" y1="203" x2="0" y2="377">
          <stop offset="0%"   stop-color="#6fd2ff"/>
          <stop offset="50%"  stop-color="#a9e2ff"/>
          <stop offset="100%" stop-color="#6fd2ff"/>
        </linearGradient>
        <linearGradient id="waveC" gradientUnits="userSpaceOnUse" x1="0" y1="755" x2="0" y2="825">
          <stop offset="0%"   stop-color="#6fd2ff"/>
          <stop offset="50%"  stop-color="#a9e2ff"/>
          <stop offset="100%" stop-color="#6fd2ff"/>
        </linearGradient>
        <!-- Timeline gradient (fade at both ends), horizontal -->
        <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="984" y2="0">
          <stop offset="0%"   stop-color="#5ecbff" stop-opacity="0"/>
          <stop offset="14%"  stop-color="#5ecbff" stop-opacity="0.34"/>
          <stop offset="86%"  stop-color="#5ecbff" stop-opacity="0.34"/>
          <stop offset="100%" stop-color="#5ecbff" stop-opacity="0"/>
        </linearGradient>
        <!-- The gesture traced in lane two -->
        <linearGradient id="gestureGrad" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="955" y2="0">
          <stop offset="0%"   stop-color="#6fd2ff" stop-opacity="0.25"/>
          <stop offset="30%"  stop-color="#a9e2ff" stop-opacity="1"/>
          <stop offset="70%"  stop-color="#a9e2ff" stop-opacity="1"/>
          <stop offset="100%" stop-color="#6fd2ff" stop-opacity="0.25"/>
        </linearGradient>
        <!-- Vertical tie line through the moment every reading shares -->
        <linearGradient id="tieGrad" gradientUnits="userSpaceOnUse" x1="0" y1="143" x2="0" y2="937">
          <stop offset="0%"   stop-color="#5ecbff" stop-opacity="0"/>
          <stop offset="18%"  stop-color="#5ecbff" stop-opacity="0.3"/>
          <stop offset="82%"  stop-color="#5ecbff" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#5ecbff" stop-opacity="0"/>
